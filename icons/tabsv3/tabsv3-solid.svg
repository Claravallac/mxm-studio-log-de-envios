<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="128" height="128" rx="22" fill="#3b2266"/>

  <!-- three stacked/tonal tabs, echoing Echoform's rings but as layered surfaces -->
  <g>
    <rect x="22" y="76" width="84" height="22" rx="10" fill="#c9a3ff" opacity="0.22"/>
    <rect x="28" y="52" width="72" height="22" rx="10" fill="#c9a3ff" opacity="0.5"/>
    <rect x="34" y="28" width="60" height="22" rx="10" fill="#c9a3ff"/>
  </g>

  <!-- small accent dot on the active tab, echoing the center dot of the Echoform mark -->
  <circle cx="64" cy="39" r="4.5" fill="#3b2266"/>
</svg>
