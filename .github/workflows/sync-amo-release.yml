name: Sync versão da AMO pro GitHub Releases
# Roda sozinho a cada 15 minutos (deslocado do :00 pra evitar o horário
# de maior fila do GitHub Actions), verificando se saiu uma versão nova
# na Mozilla (AMO). Se sim, baixa o .xpi publicado lá e cria uma Release
# aqui no GitHub com ele. Também pode ser disparado manualmente pela
# aba "Actions" do repositório (botão "Run workflow").
on:
  schedule:
    - cron: '7-59/15 * * * *'
  workflow_dispatch: {}
# Necessário pra esse robô poder criar Releases neste repositório.
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar versão atual na AMO
        id: amo
        run: |
          # A API da AMO às vezes devolve 503 "Backend.max_conn reached"
          # quando o backend deles está sobrecarregado. É instabilidade
          # passageira do lado deles, então tentamos de novo algumas vezes
          # com espera crescente (backoff) antes de desistir.
          TENTATIVAS=5
          ESPERA=10  # segundos; dobra a cada nova tentativa
          for i in $(seq 1 "$TENTATIVAS"); do
            RESPOSTA=$(curl -sS \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
              -H "Accept: application/json" \
              -w "\n%{http_code}" \
              "https://addons.mozilla.org/api/v5/addons/addon/mxm-studio-log/")
            STATUS=$(echo "$RESPOSTA" | tail -n1)
            DADOS=$(echo "$RESPOSTA" | sed '$d')
            if [ "$STATUS" = "200" ]; then
              break
            fi
            echo "Tentativa $i/$TENTATIVAS: a AMO respondeu com status $STATUS (esperado 200)."
            if [ "$i" -eq "$TENTATIVAS" ]; then
              echo "Esgotei as tentativas. Corpo da última resposta:"
              echo "$DADOS"
              exit 1
            fi
            echo "Aguardando ${ESPERA}s antes de tentar de novo..."
            sleep "$ESPERA"
            ESPERA=$((ESPERA * 2))
          done
          VERSAO=$(echo "$DADOS" | jq -r '.current_version.version')
          URL_ARQUIVO=$(echo "$DADOS" | jq -r '.current_version.file.url')
          if [ -z "$VERSAO" ] || [ "$VERSAO" = "null" ]; then
            echo "Não consegui ler a versão atual na resposta da AMO. Corpo da resposta:"
            echo "$DADOS"
            exit 1
          fi
          # As "release notes" que você preenche na AMO ao publicar a versão
          # ficam em current_version.release_notes, um objeto por idioma
          # (ex.: {"pt-BR": "...", "en-US": "..."}). Prioriza pt-BR, cai pra
          # en-US, e por último pega o primeiro idioma disponível — se o
          # campo não foi preenchido nessa versão, fica vazio mesmo.
          NOTAS=$(echo "$DADOS" | jq -r '
            .current_version.release_notes as $rn
            | if $rn == null then ""
              else ($rn["pt-BR"] // $rn["en-US"] // ([$rn[]][0]) // "")
              end
          ')
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"
          echo "url_arquivo=$URL_ARQUIVO" >> "$GITHUB_OUTPUT"
          {
            echo "notas_release<<EOF_NOTAS_AMO"
            echo "$NOTAS"
            echo "EOF_NOTAS_AMO"
          } >> "$GITHUB_OUTPUT"
      - name: Verificar se essa versão já tem Release aqui
        id: checar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.amo.outputs.versao }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "ja_existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "ja_existe=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Baixar o .xpi da AMO
        if: steps.checar.outputs.ja_existe == 'false'
        run: |
          curl -L --retry 3 --retry-delay 5 --retry-all-errors \
            -o "mxm-studio-log-${{ steps.amo.outputs.versao }}.xpi" \
            "${{ steps.amo.outputs.url_arquivo }}"
      - name: Criar a Release no GitHub
        if: steps.checar.outputs.ja_existe == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTAS_AMO: ${{ steps.amo.outputs.notas_release }}
        run: |
          # Monta as notas da Release: usa as "release notes" da AMO como
          # corpo principal (quando existirem) e sempre acrescenta a linha
          # padrão de rodapé indicando a origem automática.
          RODAPE="Publicado automaticamente a partir da versão ${{ steps.amo.outputs.versao }} disponível na Mozilla Add-ons (addons.mozilla.org)."
          if [ -n "$NOTAS_AMO" ]; then
            NOTAS_FINAIS=$(printf '%s\n\n---\n%s' "$NOTAS_AMO" "$RODAPE")
          else
            NOTAS_FINAIS="$RODAPE"
          fi
          gh release create "v${{ steps.amo.outputs.versao }}" \
            "mxm-studio-log-${{ steps.amo.outputs.versao }}.xpi" \
            --repo "${{ github.repository }}" \
            --title "v${{ steps.amo.outputs.versao }}" \
            --notes "$NOTAS_FINAIS"
